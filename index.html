<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="ぴーちゃん">

<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%20%22%E3%81%B4%E3%83%BC%E3%81%A1%E3%82%83%E3%82%93%E3%83%88%E3%83%AC%E3%83%BC%E3%83%8B%E3%83%B3%E3%82%B0%22%2C%20%22short_name%22%3A%20%22%E3%81%B4%E3%83%BC%E3%81%A1%E3%82%83%E3%82%93%22%2C%20%22display%22%3A%20%22standalone%22%2C%20%22orientation%22%3A%20%22portrait%22%2C%20%22background_color%22%3A%20%22%23fff4f8%22%2C%20%22theme_color%22%3A%20%22%23f0558d%22%7D">
<title>ぴーちゃんトレーニング</title>
<style>
:root{--bg:#fff4f8;--fg:#3a2a35;--card:#fff;--line:#f6cfe0;--btn:#f0558d;--sh:#bd3a6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241a22;--fg:#fbeef5;--card:#3a2b36;--line:#6b4a5f;--btn:#d9709c;--sh:#8f4569}}
:root[data-theme="dark"]{--bg:#241a22;--fg:#fbeef5;--card:#3a2b36;--line:#6b4a5f;--btn:#d9709c;--sh:#8f4569}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#app,.top{max-width:480px;margin:0 auto}
#app{padding:4px 16px 24px;text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 0}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px 14px 3px 10px;font-weight:800;font-size:20px}
.pill svg{width:30px;height:18px}
.pulse{animation:pulse .4s}
.ib{width:44px;height:44px;padding:0;margin:0;border-radius:50%;background:var(--card);border:2px solid var(--line);color:var(--fg);box-shadow:none;display:inline-flex;align-items:center;justify-content:center}
.ib svg{width:24px;height:24px}
.hd{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;margin:8px 0}
h1{font-size:22px;margin:0}
p{font-size:18px;line-height:1.6;margin:8px 0;min-height:1.6em}
button{font:inherit;font-weight:800;font-size:20px;border:0;border-radius:18px;background:var(--btn);color:#fff;padding:14px 18px;margin:8px 0;width:100%;cursor:pointer;box-shadow:0 4px 0 var(--sh);transition:transform .08s,box-shadow .08s;-webkit-tap-highlight-color:transparent}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sh)}
.ib:active{transform:scale(.92);box-shadow:none}
.menucard{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);color:var(--fg);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.menucard small{display:block;font-size:14px;font-weight:600;opacity:.7;margin-top:2px}
.mi{width:56px;height:56px;flex:none}.mi svg{width:100%;height:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:30px;height:22px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sub{background:var(--card);color:var(--fg);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.card{aspect-ratio:1;padding:0;margin:0;overflow:hidden;background:var(--card);border:3px solid var(--line);border-radius:12px;box-shadow:none}
.card:active{transform:none}
.card svg,.pad svg,.slot svg{width:100%;height:100%;display:block}
.card.o{padding:3px}.card.done{opacity:.45}
.card.o svg{animation:flipin .28s ease-out}
.pads{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.pad{aspect-ratio:1;padding:6px;margin:0;background:var(--card);border:4px solid var(--line);box-shadow:none;transition:background .1s}
.pad.on{background:#fff3a0;border-color:#ffb300}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-height:52px;margin:8px 0}
.slot{width:48px;height:48px;border:2px dashed var(--line);border-radius:10px;padding:2px}
.slot.f{border-style:solid;background:var(--card)}.slot.x{border:3px solid #e53935}
.gain{display:inline-flex;align-items:center;gap:4px;background:#ffe9a8;color:#6a4a00;border-radius:999px;padding:0 12px;font-weight:800;margin-left:6px;vertical-align:middle}
.gain svg{width:26px;height:16px}
.room{position:relative;height:280px;border-radius:20px;overflow:hidden;border:3px solid var(--line);margin:8px 0}
.room.sm{height:200px}
.wall{position:absolute;inset:0 0 35% 0}.floor{position:absolute;inset:65% 0 0 0}
.deco{position:absolute;width:56px;height:56px}.deco svg{width:100%;height:100%}
#pet{cursor:pointer;transform-origin:50% 100%}
#pet svg{display:block;height:100%;overflow:visible;animation:breathe 2s ease-in-out infinite;transform-origin:bottom}
.ear{transform-box:view-box;transform-origin:35px 48px;animation:ear 3s ease-in-out infinite;transition:transform .25s}
.ear2{transform-origin:65px 48px}
.ear2{animation-delay:.5s}
#pet.m-h{animation:jump .55s ease-in-out 3}
#pet.m-o{animation:startle 1.1s ease-out}
#pet.m-s{animation:slump 1.8s ease-in-out forwards}
#pet.m-z{animation:doze 3s ease-in-out}
#pet.m-e{animation:chew .3s ease-in-out infinite}
#pet.m-h .ear{animation:flapL .25s ease-in-out 6}
#pet.m-h .ear2{animation:flapR .25s ease-in-out 6}
#pet.m-o .ear,#pet.m-o .ear2{animation:none;transform:scaleY(1.18)}
#pet.m-s .ear,#pet.m-z .ear{animation:none;transform:rotate(-30deg)}
#pet.m-s .ear2,#pet.m-z .ear2{animation:none;transform:rotate(30deg)}
.fx{position:absolute;width:26px;height:26px;pointer-events:none;opacity:0;animation:rise 1.3s ease-out forwards}
.fx svg{width:100%;height:100%}
.f-drop{animation-name:fall}.f-bang{animation-name:pop2;width:30px;height:30px}
.stat{display:flex;align-items:center;gap:10px}
.lv{background:#ffd54a;color:#5a3d00;border-radius:999px;padding:2px 12px;font-weight:800;white-space:nowrap}
.prog{flex:1;height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--btn);transition:width .4s}
.cols{display:flex;gap:10px;justify-content:center}
.dot{width:42px;height:42px;padding:0;margin:8px 0;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line)}
.dot.sel{box-shadow:0 0 0 3px var(--fg)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px}
.tab{flex:none;width:auto;margin:0;padding:8px 14px;font-size:16px;background:var(--card);color:var(--fg);border:2px solid var(--line);box-shadow:none}
.tab.on{background:var(--btn);color:#fff;border-color:var(--btn)}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0}
.it{position:relative;margin:0;padding:10px 4px 8px;background:var(--card);color:var(--fg);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px}
.it.on{border-color:var(--btn)}
.ico{width:56px;height:56px;border-radius:12px;border:2px solid var(--line)}
svg.ico{border:0}
.price{display:inline-flex;align-items:center;gap:3px;font-weight:800;font-size:15px}
.price svg{width:24px;height:14px}.price.own{opacity:.65;font-size:13px}
.tick{position:absolute;top:4px;right:4px;width:22px;height:22px}.tick svg{width:100%;height:100%}
.bob{animation:bob 2s ease-in-out infinite}
.sec{background:var(--card);border:3px solid #7fd0ff;border-radius:22px;padding:8px 12px 4px;margin:14px 0;text-align:left}
.sec.h{border-color:#ffb3cf}
.secT{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;margin:2px 0 4px}
.tag{border-radius:999px;padding:2px 14px;font-size:18px;font-weight:800;color:#fff;background:#3aa6e0;white-space:nowrap}
.sec.h .tag{background:var(--btn)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menucard.v{flex-direction:column;text-align:center;gap:6px}
.menucard>span:first-child{flex:none}

:root{--dot:rgba(240,85,141,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--dot:rgba(255,255,255,.04)}}
:root[data-theme="dark"]{--dot:rgba(255,255,255,.04)}
body{background-image:radial-gradient(var(--dot) 2px,transparent 2.5px);background-size:22px 22px}
body.wide #app,body.wide .top{max-width:980px}
button{background-image:linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,0) 55%);box-shadow:0 4px 0 var(--sh),inset 0 1px 0 rgba(255,255,255,.45)}
h1{letter-spacing:.03em;text-shadow:0 2px 0 rgba(240,85,141,.15)}
.hd{padding-bottom:8px;border-bottom:2px dashed var(--line);margin-bottom:12px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 12px;margin:0 0 10px;box-shadow:0 3px 0 var(--line);text-align:left}
.pt{font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--btn);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.pt::before{content:"";width:6px;height:14px;border-radius:3px;background:var(--btn)}
.lr{display:grid;grid-template-columns:1.15fr 1fr;gap:14px;align-items:start;text-align:left}
.lr .left p{text-align:center}
.sticky{position:sticky;top:8px}
.acts{grid-template-columns:repeat(auto-fit,minmax(112px,1fr))}
.cols{flex-wrap:wrap;gap:8px}.cols .dot{margin:2px 0}
.prog{height:16px;border:2px solid var(--line);background:var(--bg)}
.prog i{background-image:linear-gradient(rgba(255,255,255,.35),transparent),repeating-linear-gradient(45deg,transparent 0 8px,rgba(255,255,255,.25) 8px 16px)}
.room{box-shadow:0 4px 0 var(--line),inset 0 0 0 3px rgba(255,255,255,.35)}
.room.tall{height:400px}
.wall::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;background:rgba(255,255,255,.75);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.floor::before{content:"";position:absolute;left:0;right:0;top:0;height:16px;background:linear-gradient(rgba(0,0,0,.18),transparent)}
.petw{position:absolute;bottom:7%;aspect-ratio:100/142;left:50%;transform:translateX(-50%)}
.petw::after{content:"";position:absolute;left:14%;right:14%;bottom:-3px;height:9px;border-radius:50%;background:rgba(0,0,0,.2);z-index:-1}
#pet{height:100%}
.arm{transform-box:fill-box;transform-origin:50% 6%;animation:swingL 1.6s ease-in-out infinite;transition:transform .25s}
.arm2{animation-name:swingR}
.ft{transform-box:fill-box;animation:step .8s ease-in-out infinite}
.ft2{animation-delay:.4s}
#pet.m-h .arm{animation:upL .3s ease-in-out 6}
#pet.m-h .arm2{animation:upR .3s ease-in-out 6}
#pet.m-o .arm{animation:none;transform:rotate(100deg)}
#pet.m-o .arm2{animation:none;transform:rotate(-100deg)}
#pet.m-s .arm,#pet.m-z .arm{animation:none;transform:rotate(-6deg)}
#pet.m-s .arm2,#pet.m-z .arm2{animation:none;transform:rotate(6deg)}
#pet.m-e .arm{animation:none;transform:rotate(40deg)}
#pet.m-e .arm2{animation:none;transform:rotate(-40deg)}
.items{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.ico{background:var(--bg)}
.it.on{box-shadow:0 3px 0 var(--btn)}
.price{background:var(--bg);border-radius:999px;padding:1px 8px}
@media (max-width:719px){.lr.sp{display:block}}
@media (max-width:440px){.lr{gap:8px}.lr .btn{font-size:16px;padding:10px 6px}.panel{padding:8px}.lv{font-size:14px}.cols .dot{width:34px;height:34px}.lr .btn svg{width:24px}}
@keyframes swingL{50%{transform:rotate(14deg)}}
@keyframes swingR{50%{transform:rotate(-14deg)}}
@keyframes step{50%{transform:translateY(-3px)}}
@keyframes upL{0%,100%{transform:rotate(130deg)}50%{transform:rotate(155deg)}}
@keyframes upR{0%,100%{transform:rotate(-130deg)}50%{transform:rotate(-155deg)}}
input{font:inherit;font-size:20px;width:100%;padding:14px 16px;margin:6px 0;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--fg);-webkit-user-select:text;user-select:text;outline:none}
input:focus{border-color:var(--btn)}
#app.enter{animation:enter .38s cubic-bezier(.2,.8,.2,1)}
#who{flex:1;text-align:center;font-size:14px;font-weight:700;opacity:.7;padding:0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec.a{border-color:#ffb347}.sec.a .tag{background:#f09a1a}
.tab svg{width:18px;height:18px;vertical-align:middle}.tab .c{display:inline-flex;align-items:center;gap:3px}.tab .c svg{width:24px;height:14px}
.qbox{font-size:44px;font-weight:800;margin:14px 0;padding:18px;background:var(--card);border:3px solid var(--line);border-radius:20px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cho{font-size:30px;padding:20px;margin:0;background:var(--card);color:var(--fg);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.cho.good{background:#b8f0c8;border-color:#3dbb6a}.cho.bad{background:#ffc9c9;border-color:#e53935}
.card.num{font-size:26px;font-weight:800;color:var(--fg);display:flex;align-items:center;justify-content:center;padding:0}
.card.num.done{background:var(--line);opacity:.5}.card.num.bad{background:#ffc9c9}
#pet.m-z{animation:nod 2.6s ease-in-out 2}
#pet.m-k{transform-origin:50% 55%;animation:sleepdown 1s ease-out forwards,snore 3s ease-in-out 1s infinite}
#pet.m-g{animation:energy .45s ease-in-out 5}
#pet.m-j{animation:sway 1.1s ease-in-out 3}
#pet.m-b{animation:drift 3.5s ease-in-out}
#pet.m-a{animation:shake .1s linear 24}
#pet.m-f{transform-origin:50% 50%;animation:flipo 3.5s ease-in-out forwards}
#pet.m-r{transform-origin:50% 60%;animation:spino 1.7s ease-in-out}
#pet.m-d{animation:dance .8s ease-in-out 4}
#pet.m-g .ear,#pet.m-d .ear{animation:flapL .2s ease-in-out infinite}
#pet.m-g .ear2,#pet.m-d .ear2{animation:flapR .2s ease-in-out infinite}
#pet.m-j .ear{animation:flapL .5s ease-in-out infinite}
#pet.m-j .ear2{animation:flapR .5s ease-in-out infinite}
#pet.m-a .ear{animation:none;transform:rotate(-16deg)}
#pet.m-a .ear2{animation:none;transform:rotate(16deg)}
#pet.m-b .ear,#pet.m-k .ear{animation:none;transform:rotate(-26deg)}
#pet.m-b .ear2,#pet.m-k .ear2{animation:none;transform:rotate(26deg)}
@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes nod{0%,100%{transform:none}30%{transform:translateY(4%) rotate(11deg)}38%{transform:rotate(-2deg)}60%{transform:translateY(3%) rotate(9deg)}68%{transform:none}}
@keyframes sleepdown{to{transform:translateY(24%) rotate(86deg) scale(.75)}}
@keyframes snore{0%,100%{transform:translateY(24%) rotate(86deg) scale(.75)}50%{transform:translateY(24%) rotate(86deg) scale(.79)}}
@keyframes energy{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14%) rotate(3deg)}}
@keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) translateY(-4%)}}
@keyframes drift{0%,100%{transform:none}50%{transform:rotate(3deg) translateX(3%)}}
@keyframes shake{0%,100%{transform:translateX(-2%) scale(1.05)}50%{transform:translateX(2%) scale(1.05)}}
@keyframes flipo{0%{transform:none}22%{transform:translateY(-35%) rotate(180deg)}34%{transform:rotate(180deg)}46%{transform:rotate(172deg)}58%{transform:rotate(188deg)}70%{transform:rotate(180deg)}84%{transform:translateY(-30%) rotate(360deg)}100%{transform:rotate(360deg)}}
@keyframes spino{0%{transform:none}40%{transform:translateY(-25%) rotate(200deg) scale(1.05)}100%{transform:rotate(360deg)}}
@keyframes dance{0%,100%{transform:rotate(-10deg) scale(1.04,.96)}25%,75%{transform:translateY(-8%)}50%{transform:rotate(10deg) scale(1.04,.96)}}
.mach{width:150px;display:block;margin:6px auto}
.mach.shake{animation:rattle .12s linear 8}
.rv{min-height:170px;text-align:center}
.rvc{position:relative;display:inline-flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:12px 14px;animation:pop3 .5s cubic-bezier(.2,1.4,.4,1)}
.rvc.r2{border-color:#6cc6ff}.rvc.r3{border-color:#ffc400;box-shadow:0 0 18px #ffd54a}
.rvc .ico{width:72px;height:72px}.rvc.big{padding:16px 26px}
.rvc b{font-size:18px}.rvc small{font-size:13px;font-weight:700;color:var(--btn)}
.new{position:absolute;top:-8px;right:-8px;background:#e53935;color:#fff;font-style:normal;font-weight:800;font-size:12px;border-radius:999px;padding:2px 8px;z-index:1}
.rvg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rvg .rvc{padding:6px 2px;border-width:2px}.rvg .rvc .ico{width:44px;height:44px}.rvg .rvc b{font-size:11px}
.cap{width:70px;animation:capdrop .9s ease-in both}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin:8px 0}
.dc{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 4px;text-align:center;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.dv{width:64px;height:78px;display:flex;align-items:center;justify-content:center}
.dv svg,.dv .ico{width:100%;height:100%;border:0;background:none}
.dv.sil{filter:brightness(0);opacity:.22}
#pet.m-egg{transform-origin:50% 100%}
#pet.m-egg svg{animation:wobble 2.6s ease-in-out infinite;transform-origin:bottom}
#pet.m-hatch{animation:hatchshake .15s linear 10}
#pet.m-hatch svg{animation:none}
.crack{opacity:0}#pet.m-hatch .crack{opacity:1}
@keyframes rattle{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) translateY(-2px)}}
@keyframes pop3{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes capdrop{0%{transform:translateY(-70px);opacity:0}50%{opacity:1}70%{transform:translateY(0)}85%{transform:translateY(-14px)}100%{transform:translateY(0) rotate(20deg)}}
@keyframes wobble{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-5deg)}80%{transform:rotate(5deg)}90%{transform:rotate(-3deg)}}
@keyframes hatchshake{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}

:root{--h1:#fff4f8;--h2:#e6f5ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--h1:#2a1e2a;--h2:#1c2a3a}}
:root[data-theme="dark"]{--h1:#2a1e2a;--h2:#1c2a3a}
.top,#app{position:relative;z-index:1}
body.hub{background:linear-gradient(160deg,var(--h1),var(--h2)) fixed}
body.hub #app{padding-bottom:170px}
#bubs{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;display:none}
body.hub #bubs{display:block}
#bubs span{position:absolute;bottom:-80px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.95),rgba(255,170,205,.22));animation:floatup linear infinite}
.corner{position:absolute;z-index:60;width:180px;height:180px;border-radius:50%;border:0;margin:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;font-weight:800;box-shadow:0 8px 0 rgba(0,0,0,.16),0 16px 30px rgba(0,0,0,.28),inset 0 5px 0 rgba(255,255,255,.5),inset 0 -9px 0 rgba(0,0,0,.12);animation:bobc 3.2s ease-in-out infinite;background-image:none;transition:transform .2s}
body.hub .corner{display:flex}
.corner::before{content:"";position:absolute;inset:12px;border-radius:50%;border:3px dashed rgba(255,255,255,.6);animation:spinr 24s linear infinite}
.corner.bl{left:-64px;bottom:-64px;padding:0 0 64px 64px;background:radial-gradient(circle at 65% 35%,#9fe0ff,#3a8fc8)}
.corner.br{right:-64px;bottom:-64px;padding:0 64px 64px 0;background:radial-gradient(circle at 35% 35%,#ffd6e6,#f0558d)}
.corner svg{width:48px;height:48px}.corner b{font-size:17px;text-shadow:0 2px 0 rgba(0,0,0,.22)}

let AC=null,MG=null,snd=true;
function ac(){if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(A){AC=new A();const cp=AC.createDynamicsCompressor();MG=AC.createGain();MG.gain.value=.9;MG.connect(cp);cp.connect(AC.destination)}}if(AC&&AC.state!=='running'&&AC.resume)AC.resume();return AC}
function osc(f,t,type='sine',v=.2,d=0,f2=0){
  if(!snd)return;const a=ac();if(!a)return;
  const o=a.createOscillator(),g=a.createGain(),s=a.currentTime+d;
  o.type=type;o.frequency.setValueAtTime(f,s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+t);
  g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+.008);g.gain.exponentialRampToValueAtTime(.0001,s+t);
  o.connect(g);g.connect(MG);o.start(s);o.stop(s+t+.03);
}
const bell=(f,v=.2,d=0,t=.7)=>{osc(f,t,'sine',v,d);osc(f*2.76,t*.35,'sine',v*.35,d);osc(f*5.4,t*.15,'sine',v*.12,d)};
const mar=(f,v=.25,d=0)=>{osc(f,.5,'sine',v,d);osc(f*4,.12,'sine',v*.4,d)};
function noise(t,v,d,fq){
  if(!snd)return;const a=ac();if(!a)return;
  const n=a.sampleRate*t|0,b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);
  for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();
  fl.type='bandpass';fl.frequency.value=fq;g.gain.value=v;s.buffer=b;s.connect(fl);fl.connect(g);g.connect(MG);s.start(a.currentTime+d);
}

const MC={e:{p:6,cols:3,delay:800,base:24,min:5,max:12,acc:0},n:{p:10,cols:4,delay:700,base:40,min:10,max:30,acc:1},h:{p:15,cols:5,delay:500,base:70,min:15,max:45,acc:1}};
function memory(k){

  if(c.acc){const combos=[];C.forEach((_,ci)=>ACC.forEach((_,ai)=>combos.push([ci,ai])));pairs=shuffle(combos).slice(0,c.p)}
  else pairs=shuffle(C.map((_,ci)=>[ci,0])).slice(0,c.p);

  let open=[],done=0,moves=0,lock=false;
  app.innerHTML=hd('神経衰弱')+`<p id="m"></p><div class="grid" id="g" style="grid-template-columns:repeat(${c.cols},1fr)"></div>`;
  const m=document.getElementById('m'),g=document.getElementById('g');
  const info=()=>m.textContent=LV.mem[k].n+'　手数：'+moves+(best[k]?'　最少：'+best[k]+'回':'');
  info();
  cards.forEach(([ci,ai])=>{
    const b=document.createElement('button');b.className='card';b.innerHTML=BACK;
    b.onclick=()=>{
      if(lock||b.dataset.o||b.dataset.d||open.length>=2)return;
      b.dataset.o=1;b.className='card o';b.innerHTML=bun(C[ci],ACC[ai]);SE.flip();open.push([b,ci+'-'+ai]);
      if(open.length==2){
        moves++;info();lock=true;const [x,y]=open;
        setTimeout(()=>{
          if(x[1]==y[1]){
            x[0].dataset.d=y[0].dataset.d=1;x[0].classList.add('done');y[0].classList.add('done');done++;SE.match();
            if(done==c.p){
              if(!best[k]||moves<best[k]){best[k]=moves;persist()}
              const r=Math.max(c.min,Math.min(c.max,c.base-moves));earn(r);
              m.innerHTML=moves+'手でクリア！（最少：'+best[k]+'回）'+gain(r);g.classList.add('win');SE.win();setTimeout(SE.candy,500);
            }
          }else{SE.miss();[x[0],y[0]].forEach(e=>{delete e.dataset.o;e.className='card';e.innerHTML=BACK})}

/* ---- 順番覚え（毎回ランダムな順番） ---- */
const QC={e:{pads:4,cols:2,start:2,on:[700,25,400],gap:[350,15,200],rw:l=>1+Math.floor(l/3)},n:{pads:6,cols:3,start:3,on:[600,35,260],gap:[300,20,120],rw:l=>2+Math.floor(l/3)},h:{pads:6,cols:3,start:4,on:[500,35,200],gap:[250,20,90],rw:l=>3+Math.floor(l/2)}};
function seq(k){
  wide(0);const q=QC[k],best=save.best.seq;let s=[],level=0,pos=0,busy=true,alive=true;
  const rnd=()=>rand(q.pads);
  app.innerHTML=hd('順番覚え')+`<p id="m"></p><div class="slots" id="sl"></div><div class="pads" id="p" style="grid-template-columns:repeat(${q.cols},1fr);${q.cols==2?'max-width:340px;margin:12px auto':''}"></div><button id="go">開始</button>`;
  const m=document.getElementById('m'),p=document.getElementById('p'),sl=document.getElementById('sl'),go=document.getElementById('go'),tm=[];
  const pads=C.slice(0,q.pads).map((c,i)=>{
    const b=document.createElement('button');b.className='pad';b.innerHTML=bun(c);b.setAttribute('aria-label',colorName[i]);
    b.addEventListener('pointerdown',e=>{e.preventDefault();press(i)});
    b.onclick=e=>{if(e.detail===0)press(i)};
    p.appendChild(b);return b;
  });
  function lit(i,ms){const b=pads[i];b.classList.remove('on');void b.offsetWidth;b.classList.add('on');clearTimeout(tm[i]);tm[i]=setTimeout(()=>b.classList.remove('on'),ms)}
  function initSlots(){sl.innerHTML='';s.forEach(()=>{const d=document.createElement('div');d.className='slot';sl.appendChild(d)})}
  async function round(){
    busy=true;pos=0;level++;
    s=Array.from({length:q.start+level-1},rnd);   /* 毎ラウンド、順番を作り直す */
    initSlots();go.style.display='none';
    m.textContent='レベル'+level+'：よく見てください（'+s.length+'個）';
    const on=Math.max(q.on[2],q.on[0]-level*q.on[1]),gap=Math.max(q.gap[2],q.gap[0]-level*q.gap[1]);
    await wait(700);
    for(const i of s){if(!alive)return;mar(N[i]);lit(i,on);await wait(on+gap)}
    if(!alive)return;
    m.textContent='同じ順番にタップしてください';busy=false;
  }
  function press(i){
    if(busy)return;
    lit(i,180);mar(N[i]);
    const slot=sl.children[pos];slot.className='slot f';slot.innerHTML=bun(C[i]);
    if(i!==s[pos]){
      busy=true;slot.classList.add('x');SE.wrong();
      const cleared=level-1;if(cleared>(best[k]||0)){best[k]=cleared;persist()}
      m.textContent='残念！レベル'+cleared+'までクリア（最高：'+(best[k]||0)+'）';
      s=[];level=0;go.textContent='もう一度';go.style.display='';return;
    }
    pos++;
    if(pos==s.length){
      busy=true;const r=q.rw(level);earn(r);
      m.innerHTML='正解！'+gain(r);setTimeout(SE.ok,250);setTimeout(SE.candy,550);
      p.classList.add('win');setTimeout(()=>{p.classList.remove('win');if(alive)round()},1200);
    }
  }
  m.textContent=LV.seq[k].n+'：開始ボタンを押してください';
  go.onclick=()=>{ac();round()};
  document.getElementById('back').onclick=()=>{alive=false;menu()};
}

/* ---- 暗算チャレンジ ---- */
const CC={e:{ops:['+','-'],max:20,q:10,rw:1},n:{ops:['+','-'],max:99,q:10,rw:2},h:{ops:['+','-','×'],max:99,q:10,rw:3}};
function calc(k){
  wide(0);const c=CC[k],best=save.best.calc;let i=0,ok=0,ans=0,lock=false;
  app.innerHTML=hd('暗算チャレンジ')+'<p id="m"></p><div class="qbox" id="q"></div><div class="choices" id="ch"></div>';
  const m=document.getElementById('m'),q=document.getElementById('q'),ch=document.getElementById('ch');
  function fin(){
    const r=ok*c.rw+(ok==c.q?5:0);earn(r);if(ok>(best[k]||0)){best[k]=ok;persist()}
    q.textContent=ok+' / '+c.q;ch.innerHTML='<button id="again" style="grid-column:1/3">もう一度</button>';
    m.innerHTML='結果（最高：'+best[k]+'問）'+gain(r);SE.win();setTimeout(SE.candy,500);
    document.getElementById('again').onclick=()=>calc(k);
  }
  function next(){
    if(i>=c.q)return fin();
    i++;lock=false;
    const op=c.ops[rand(c.ops.length)];let a,b;
    if(op=='×'){a=2+rand(11);b=2+rand(9);ans=a*b}
    else if(op=='+'){a=1+rand(c.max);b=1+rand(c.max);ans=a+b}
    else{a=2+rand(c.max-1);b=1+rand(a-1);ans=a-b}
    q.textContent=a+' '+op+' '+b+' ＝ ？';
    const set=new Set([ans]);
    while(set.size<4){const v=ans+(1+rand(op=='×'?12:10))*(rand(2)?1:-1);if(v>=0)set.add(v)}
    ch.innerHTML='';
    shuffle([...set]).forEach(v=>{const btn=document.createElement('button');btn.className='cho';btn.textContent=v;btn.onclick=()=>{
      if(lock)return;lock=true;
      if(v==ans){ok++;SE.match();btn.classList.add('good')}else{SE.wrong();btn.classList.add('bad')}
      setTimeout(next,600)};ch.appendChild(btn)});
    m.textContent='第'+i+'問 / '+c.q+'問　正解 '+ok;
  }
  document.getElementById('back').onclick=menu;
  next();
}

  const who=document.getElementById('who');if(who){who.textContent=acct;who.onclick=()=>{ac();SE.equip();acctMenu()}}
  const egg=!P();
  const care=egg?`<div class="panel" style="text-align:center"><div class="pt" style="justify-content:center">卵</div><p style="margin:0 0 10px;font-size:16px">孵化させると、ランダムな体の色のピープスが生まれます。</p><button class="btn" id="ha">${I.candy}孵化させる（${admin?0:HATCH}）</button></div>`
   :`<div class="hubgrid"><div class="panel"><div class="pt">ステータス</div><button class="sub nmb" id="nm">${esc(P().name||'ぴーちゃん')}${I.pen}</button><div class="ringw" style="margin:0 auto"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="34" fill="none" stroke="var(--line)" stroke-width="8"/><circle id="rg" cx="40" cy="40" r="34" fill="none" stroke="var(--btn)" stroke-width="8" stroke-linecap="round" stroke-dasharray="0 214" transform="rotate(-90 40 40)"/></svg><b id="lv"></b></div><div class="nxt" id="nx"></div><small id="fedn"></small></div>
   <div class="panel"><div class="pt">お世話</div><div class="rbs"><button class="rb sub" id="fd">${I.candy}<b>あげる</b></button><button class="rb sub" id="pat">${I.paw}<b>撫でる</b></button><button class="rb sub" id="nap">${I.moon}<b>寝かせる</b></button><button class="rb sub" id="rl">${I.leaf}<b id="rlb">野に放つ</b></button></div></div></div>`;
  app.innerHTML=`<div class="hubwrap">${roomTabs(1)}${room('sm')}<p id="msg"></p>${care}</div>`;
  paint();bindRooms(home);fitCorners();
  if(egg){
    document.getElementById('ha').onclick=()=>{
      ac();if(!canPay(HATCH)){SE.miss();say('飴が足りません（あと'+(HATCH-save.candy)+'個）');return}
      pay(HATCH);document.getElementById('pet').className='m-hatch';SE.gacha();
      setTimeout(()=>{
        const e=rollBody(),isNew=!save.dex[e[0]];
        R().pet=makePet(e);save.dex[e[0]]=1;persist();SE.win();home();
        setTimeout(()=>{fx('spark',8);say(e[1]+'が生まれました'+(isNew?'（図鑑に登録）':''))},60);setTimeout(()=>askName(true),900);
      },1500);
    };
    return;
  }
  document.getElementById('pet').onclick=()=>{
    ac();const e=['h','o','g','j','d','r','f','a','z','b'][rand(10)];ESE[e]();emote(e);
  };
  document.getElementById('fd').onclick=()=>{
    ac();
    if(!canPay(1)){SE.sad();emote('s');say('飴が足りません。ゲームで集めましょう。');return}
    pay(1);P().fed++;persist();SE.eat();emote('e');
    if(P().fed%5==0&&P().fed<=50){setTimeout(()=>{SE.up();fx('spark',6)},900);say('レベルアップ')}else say('');
    paint();
  };
  document.getElementById('pat').onclick=()=>{ac();SE.squeak();emote('j')};
  document.getElementById('nap').onclick=()=>{ac();SE.zzz();emote('k')};
  const reward=()=>Math.max(1,Math.round(3*(BR[P().bid]||1)+P().fed*.6));
  document.getElementById('rl').onclick=()=>{
    ac();SE.equip();
    const rw=reward(),nm=esc(P().name||'ぴーちゃん');
    dlg(`<div class="dp">${pet(P())}</div><h2>${nm}を野に放ちますか？</h2><p>野に放ったピープスは、そのまま世界を旅してしまうため、今後会うことができません。</p><p>飴 +${rw} がもらえます。</p>`,
      [['やめる',()=>{SE.flip()},'sub'],['野に放つ',()=>{R().pet=null;persist();earn(rw);SE.candy();home();say('旅立ちました（飴+'+rw+'）')}]]);
  };
  document.getElementById('nm').onclick=()=>{ac();SE.equip();askName(false)};
  petT=setInterval(tick,3000);
}

/* ---- 着せ替え（持ち物から選ぶ） ---- */
let tab='hat';
function wardrobe(){
  wide(1);clearInterval(petT);skipEnter=cur=='wardrobe';cur='wardrobe';
  const y=document.getElementById('scr').scrollTop;
  const isOn=x=>{const t=x[1];return t=='deco'?R().deco.includes(x[0]):(t=='wall'||t=='floor')?R()[t]==x[0]:!!P()&&P().wear[t]==x[0]};
  const list=ITEMS.filter(x=>x[1]==tab&&save.own.includes(x[0]));
  let h=hd('着せ替え')+`<div class="lr sp"><div class="left"><div class="sticky">${roomTabs(0)}${room('sm')}<p id="msg">${!P()&&!['wall','floor','deco'].includes(tab)?'卵には着せ替えできません':'使うアイテムを選んでください'}</p></div></div><div class="right">${catTabs(tab,'t')}<div class="items">`;
  list.forEach(x=>{const on=isOn(x);h+=`<button class="it${on?' on':''}" data-id="${x[0]}">${on?`<i class="tick">${I.check}</i>`:''}${icon(x)}<span>${x[2]}</span><span class="price own">${on?'使用中':'未使用'}</span></button>`});
  app.innerHTML=h+'</div>'+(list.length?'':'<p>まだ持っていません。ガチャで手に入れましょう。</p>')+'</div></div>';skipEnter=false;
  paint();document.getElementById('scr').scrollTop=y;bindRooms(wardrobe);
  document.querySelectorAll('.tab[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;SE.flip();wardrobe()});
  document.querySelectorAll('.it').forEach(b=>b.onclick=()=>{
    ac();const x=ITEMS.find(i=>i[0]==b.dataset.id),t=x[1],id=x[0];
    if(!['wall','floor','deco'].includes(t)&&!P()){SE.miss();say('卵には着せ替えできません');return}
    SE.equip();
    if(t=='deco'){const d=R().deco,i=d.indexOf(id);i<0?d.push(id):d.splice(i,1)}
    else if(t=='wall'||t=='floor')R()[t]=id;
    else P().wear[t]=P().wear[t]==id?'':id;
    persist();wardrobe();
  });
  document.getElementById('back').onclick=menu;
}

/* ---- ガチャ（部位ごと） ---- */
const GC={hat:10,face:8,neck:8,body:12,back:14,wall:10,floor:10,deco:8};
const GCOL={hat:'#f0558d',face:'#3a8fc8',neck:'#e8a21a',body:'#3dbb6a',back:'#8a6be0',wall:'#e0527f',floor:'#2a9d8f',deco:'#d9703a'};
const RW={1:60,2:30,3:10},RAR={};
const pool=t=>ITEMS.filter(x=>x[1]==t&&x[3]>0);
Object.keys(CATS).forEach(t=>pool(t).sort((a,b)=>a[3]-b[3]).forEach((x,i,a)=>{const q=i/a.length;RAR[x[0]]=q<.4?1:q<.75?2:3}));
const rar=x=>RAR[x[0]]||1;
function pull(t){
  const pl=pool(t),tiers=[1,2,3].filter(r=>pl.some(x=>rar(x)==r));
  let r=Math.random()*tiers.reduce((s,k)=>s+RW[k],0),tr=tiers[0];
  for(const k of tiers){r-=RW[k];if(r<=0){tr=k;break}}
  const g=pl.filter(x=>rar(x)==tr);return g[rand(g.length)];
}
const machine=c=>`<svg class="mach" id="mach" viewBox="0 0 120 160"><rect x="26" y="82" width="68" height="62" rx="12" fill="${c}"/><rect x="34" y="146" width="52" height="8" rx="4" fill="#8a6b5a"/><circle cx="60" cy="52" r="40" fill="#e9f7ff" fill-opacity=".8" stroke="#9fd3f0" stroke-width="3"/><circle cx="42" cy="60" r="8" fill="#ff8fb8"/><circle cx="60" cy="70" r="8" fill="#ffe45e"/><circle cx="78" cy="58" r="8" fill="#9be58a"/><circle cx="52" cy="42" r="8" fill="#8fd3ff"/><circle cx="70" cy="38" r="8" fill="#c9a8ff"/><circle cx="60" cy="108" r="14" fill="#fff" stroke="rgba(0,0,0,.2)" stroke-width="2"/><path d="M60 98v10l7 5" stroke="#555" stroke-width="3" stroke-linecap="round" fill="none"/><rect x="44" y="126" width="32" height="14" rx="5" fill="#2d2d3a"/></svg>`;
const capsule=c=>`<svg class="cap" viewBox="0 0 70 70"><circle cx="35" cy="35" r="28" fill="#fff" stroke="rgba(0,0,0,.15)" stroke-width="2"/><path d="M7 35a28 28 0 0 1 56 0z" fill="${c}"/><path d="M7 35h56" stroke="rgba(0,0,0,.15)" stroke-width="2"/><ellipse cx="25" cy="22" rx="6" ry="3" fill="#fff" opacity=".6" transform="rotate(-30 25 22)"/></svg>`;
SE.gacha=()=>{for(let i=0;i<7;i++)noise(.06,.35,i*.09,1800+i*200)};
let gtab='hat',gbusy=false;
function gacha(){
  wide(1);cur='gacha';skipEnter=false;gbusy=false;
  const pl=pool(gtab),cost=GC[gtab];
  app.innerHTML=hd('ガチャ')+`<div class="lr sp"><div class="left"><div class="sticky">${machine(GCOL[gtab])}<div id="rv" class="rv"><p>${CATS[gtab]}ガチャ</p></div></div></div><div class="right">${catTabs(gtab,'g')}
  <div class="panel"><div class="pt">${CATS[gtab]}ガチャ</div><p id="gown" style="margin:0 0 6px"></p><div class="acts"><button class="btn" id="g1">${I.candy}1回 ${admin?0:cost}</button><button class="btn" id="g10">${I.candy}10回 ${admin?0:cost*9}</button></div><small>出現率：星1 60%・星2 30%・星3 10%（ダブりは飴に変わります）</small></div>
  <div class="acts"><button class="btn sub" id="gw">${I.wear}着せ替え</button><button class="btn sub" id="gd">${I.dex}図鑑</button></div></div></div>`;
  const own=()=>{document.getElementById('gown').textContent='所持 '+pl.filter(x=>save.own.includes(x[0])).length+' / '+pl.length};own();
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{gtab=b.dataset.g;SE.flip();gacha()});
  document.getElementById('back').onclick=menu;
  document.getElementById('gw').onclick=()=>{SE.flip();tab=gtab;wardrobe()};
  document.getElementById('gd').onclick=()=>{SE.flip();dtab=gtab;dex()};
  const rv=document.getElementById('rv');
  function doPull(n){
    ac();if(gbusy)return;
    const c=cost*(n==10?9:n);
    if(!canPay(c)){SE.miss();rv.innerHTML='<p>飴が足りません（あと'+(c-save.candy)+'個）</p>';return}
    gbusy=true;pay(c);
    const res=Array.from({length:n},()=>{const x=pull(gtab),dup=save.own.includes(x[0]);if(!dup)save.own.push(x[0]);return{x,dup,rf:dup?Math.max(1,Math.round(x[3]/3)):0}});
    const rf=res.reduce((s,r)=>s+r.rf,0);if(rf)earn(rf);persist();
    const mc=document.getElementById('mach');mc.classList.add('shake');SE.gacha();
    rv.innerHTML=capsule(GCOL[gtab]);
    setTimeout(()=>{
      mc.classList.remove('shake');
      const card=(r,big)=>`<div class="rvc r${rar(r.x)}${big?' big':''}">${r.dup?'':'<i class="new">NEW</i>'}${icon(r.x)}<b>${r.x[2]}</b>${stars(rar(r.x),big?60:42)}${r.dup&&big?`<small>ダブり 飴+${r.rf}</small>`:''}</div>`;
      rv.innerHTML=n==1?card(res[0],1):'<div class="rvg">'+res.map(r=>card(r)).join('')+'</div>'+(rf?`<p>ダブり分の飴 +${rf}</p>`:'');
      res.some(r=>rar(r.x)==3)?(SE.win(),setTimeout(SE.candy,500)):res.some(r=>!r.dup)?SE.match():SE.equip();
      own();gbusy=false;
    },950);
  }
  document.getElementById('g1').onclick=()=>doPull(1);
  document.getElementById('g10').onclick=()=>doPull(10);
}

/* ---- 図鑑（体の色・アイテム） ---- */
let dtab='color';
function dex(){
  wide(1);skipEnter=cur=='dex';cur='dex';
  const all=ITEMS.filter(x=>x[3]>0),total=BODY.length+all.length;
  const gotC=BODY.filter(e=>save.dex[e[0]]).length,gotI=all.filter(x=>save.own.includes(x[0])).length,got=gotC+gotI;
  const list=dtab=='color'?BODY:all.filter(x=>x[1]==dtab);
  const n=dtab=='color'?gotC:list.filter(x=>save.own.includes(x[0])).length;
  const cards=list.map(x=>{
    if(dtab=='color'){const o=!!save.dex[x[0]];return `<div class="dc"><div class="dv${o?'':' sil'}">${pet(dexPet(x))}</div><b>${o?x[1]:'？？？'}</b>${stars(x[3],48)}</div>`}
    const o=save.own.includes(x[0]);return `<div class="dc"><div class="dv${o?'':' sil'}">${icon(x)}</div><b>${o?x[2]:'？？？'}</b>${stars(rar(x),48)}</div>`;
  }).join('');
  app.innerHTML=hd('図鑑')+`<div class="panel"><div class="stat"><span class="lv">${got} / ${total}</span><div class="prog"><i style="width:${Math.round(got/total*100)}%"></i></div></div></div>${catTabs(dtab,'d',{color:'体の色'})}<p style="margin:4px 0">${dtab=='color'?'体の色':CATS[dtab]}：${n} / ${list.length}</p><div class="dgrid">${cards}</div>`;
  skipEnter=false;
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{dtab=b.dataset.d;SE.flip();dex()});
  document.getElementById('back').onclick=menu;
}
/* 画面の高さ：iPhoneのアドレスバー／下部バーの出入りに左右されないよう、実際に見えている高さをCSS変数に入れる */
function fit(){const h=window.visualViewport?window.visualViewport.height:window.innerHeight;document.documentElement.style.setProperty('--vh',Math.round(h)+'px')}
fit();window.addEventListener('resize',fit);window.addEventListener('orientationchange',()=>setTimeout(fit,250));
if(window.visualViewport)window.visualViewport.addEventListener('resize',fit);
/* ピンチ拡大・全体スクロール・長押しメニューの無効化（スクロールは #scr の中だけ許可） */
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
document.addEventListener('touchmove',e=>{if((e.touches&&e.touches.length>1)||!e.target.closest||!e.target.closest('#scr'))e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',e=>{if(!e.target||e.target.tagName!=='INPUT')e.preventDefault()});
document.addEventListener('dblclick',e=>e.preventDefault());
/* iOSの音声制限：最初のタップ（再生が中断された後も）で、無音を鳴らしてAudioContextを解除する */
function unlockAudio(){
  if(AC&&AC.state==='running')return;
  const a=ac();if(!a)return;
  try{const s=a.createBufferSource();s.buffer=a.createBuffer(1,1,22050);s.connect(a.destination);s.start(0)}catch(e){}
}
['touchstart','touchend','pointerdown','click','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true,capture:true}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&AC&&AC.state!=='running')AC.resume&&AC.resume()});
/* ホーム画面用アイコン（実行時に描画） */
try{const c=document.createElement('canvas');c.width=c.height=180;const g=c.getContext('2d');g.fillStyle='#ffd0e0';g.fillRect(0,0,180,180);g.fillStyle='#fff';
 g.beginPath();g.ellipse(68,48,15,40,-.1,0,7);g.fill();g.beginPath();g.ellipse(112,48,15,40,.1,0,7);g.fill();g.beginPath();g.ellipse(90,112,50,42,0,0,7);g.fill();
 g.fillStyle='#333';g.beginPath();g.arc(72,106,5.5,0,7);g.fill();g.beginPath();g.arc(108,106,5.5,0,7);g.fill();g.fillStyle='#e0607e';g.beginPath();g.ellipse(90,122,6,4,0,0,7);g.fill();
 const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.appendChild(l)}catch(e){}
(function(){
  const mk=(id,cls,label,ic,which)=>{const b=document.createElement('button');b.className='corner '+cls;b.id=id;b.setAttribute('aria-label',label);const cin=document.createElement('span'),lb=document.createElement('b'),sv=document.createElement('span');cin.className='cin';lb.textContent=label;sv.innerHTML=ic;cin.appendChild(lb);cin.appendChild(sv);b.appendChild(cin);b._lb=lb;b._cin=cin;b.onclick=()=>{ac();popOpen==which?closePop():openPop(which)};document.body.appendChild(b)};
  mk('cbl','bl','ゲーム',I.pad,'bl');mk('cbr','br','コレクション',I.gem,'br');
  const bs=document.createElement('div');bs.id='bubs';
  bs.innerHTML=Array.from({length:9},(_,i)=>{const s=26+(i*17)%46;return `<span style="left:${(i*11+6)%94}%;width:${s}px;height:${s}px;animation-duration:${13+i*2}s;animation-delay:${-i*2.7}s"></span>`}).join('');
  document.body.prepend(bs);
})();
loginScreen();
